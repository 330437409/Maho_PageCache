#
# nginx static export profile for Maho PageCache 0.8.x.
# Tested with nginx 1.31 and a single default store.
# See docs/deployment/static-export.md before using it.

map $http_cookie $pc_static_session {
    default 0;
    "~*(^|;\s*)(maho_session|maho_admin_session|frontend|om_frontend|adminhtml)=" 1;
}

map $args $pc_static_args {
    ""      0;
    default 1;
}

map $request_method $pc_static_method {
    default 1;
    GET     0;
    HEAD    0;
}

# The store cookie value is the store code. Add one line per store.
# An unknown store falls back to PHP.
map $cookie_store $pc_static_root {
    default       /__page_cache_static_off__;
    ""            /var/page-cache/static/default;
    "~^default$"  /var/page-cache/static/default;
    # "~^second$" /var/page-cache/static/second;
}

map "$pc_static_session$pc_static_args$pc_static_method" $pc_static_off {
    default 0;
    "~1"    1;
}

map $pc_static_off $pc_static_dir {
    0 $pc_static_root;
    1 /__page_cache_static_off__;
}

# Add cache headers only when nginx served a static file. A proxied PHP
# response has an upstream address, so these maps produce an empty value.
map $upstream_addr $pc_static_cache_control {
    ""      "public, max-age=0, must-revalidate";
    default "";
}

map $upstream_addr $pc_static_vary {
    ""      "Accept-Encoding, Cookie";
    default "";
}

map $upstream_addr $pc_static_marker {
    ""      "HIT-static";
    default "";
}

server {
    listen 80;
    server_name shop.example.com;

    # Maho root, not public/. The static root below is relative to it.
    root /var/www/maho;

    location ^~ /var/page-cache/ {
        deny all;
    }

    location / {
        try_files
            $pc_static_dir${uri}index.html
            $pc_static_dir$uri/index.html
            $pc_static_dir$uri
            @handler;

        gzip_static on;
        add_header Cache-Control $pc_static_cache_control always;
        add_header Vary $pc_static_vary always;
        add_header X-Page-Cache $pc_static_marker always;
    }

    location @handler {
        # Replace with the site's PHP-FPM or upstream configuration.
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
