services:
  app:
    image: webdevops/php-nginx:8.5
    working_dir: /app
    ports:
      - "8082:80"
    volumes:
      - ${MAHO_ROOT:-/home/ubuntu/maho}:/app
      - ./fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-benchmark.conf:ro
    environment:
      WEB_DOCUMENT_ROOT: /app/public

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "volatile-lfu"]
